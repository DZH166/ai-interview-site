name: validate-bank

on:
  push:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'app/**'
      - 'tests/**'
      - 'projects/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'app/**'
      - 'tests/**'
      - 'projects/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # legacy-archive-test 对照固定历史提交逐对象检查，浅克隆没有基线。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装本地桩测试依赖（不调用真实 API）
        run: python -m pip install --quiet 'markdown-it-py==2.2.0' 'openai>=2.0' 'pydantic>=2.5'

      - name: JS 语法检查
        run: |
          fail=0
          for f in app/js/*.js app/data.js app/sw.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      # 与本地使用同一个枚举器，包含 tests/*.js、baseline2/*-test.js、
      # tests/*test.py；新增 loader/progressive/archive/core-content 自动纳入。
      - name: 全部 Node 与 Python 套件
        run: python tools/validate_all.py --unit --jobs 2

      - name: 融合适配器幂等检查
        run: |
          node tools/import-pi-agent.js --check
          node tools/fuse-ai-series.js --check

      - name: 审计器自检
        run: |
          python tools/content_audit.py --selftest
          python tools/verify_sources.py --selftest
          python tools/highlight_audit.py --selftest

      - name: 重点标注、内容与来源结构审计
        run: |
          python tools/highlight_audit.py --strict
          python tools/content_audit.py --strict
          python tools/verify_sources.py --no-network

      - name: 题库结构与重复度检查
        run: |
          python tools/validate_bank.py
          python tools/dedup_check.py

      - name: 引号修复幂等性（应为 no-op）
        run: |
          python tools/fix_quotes.py
          git diff --exit-code -- data/ || {
            echo '::error::fix_quotes.py 产生了改动，请先修复并提交 data/。';
            exit 1;
          }

      - name: 构建可复现（入口、清单、全部分片与缓存戳）
        run: |
          python tools/build.py
          changes=$(git status --porcelain --untracked-files=all -- app/data.js app/data/ app/sw.js)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo '::error::构建产物与提交内容不同步。请本地运行 python tools/build.py 并提交入口、manifest、分片及 sw.js。'
            exit 1
          fi

      - name: 保存每套验证日志与退出码
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-validation
          path: output/validation/
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-1.61.1

      - name: 安装 Playwright 与 Chromium
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      # 枚举全部 tests/browser/*.js（performance.js 除外）。串行执行，
      # 避免多个浏览器争用 CPU 改变 search-cache 等套件的已有性能门槛。
      # 各套件自建隔离服务器/浏览器上下文；枚举器分配独立 PORT。
      - name: 全部浏览器回归（含按需加载、旧题访问、草稿与离线训练）
        env:
          PW: playwright
          CHROME: default
        run: python tools/validate_all.py --browser --jobs 1

      - name: 保存每套浏览器日志与退出码
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: output/validation/
          if-no-files-found: warn
