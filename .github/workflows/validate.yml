name: validate-bank

on:
  push:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'app/**'
      - 'tests/**'
      - 'projects/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'tools/**'
      - 'app/**'
      - 'tests/**'
      - 'projects/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查(node --check 逐文件)
        run: |
          fail=0
          for f in app/js/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: 行为测试(Markdown/搜索/Store 迁移/计算例题/隔离与恢复)
        run: node tests/behavior-tests.js

      - name: 回归测试(记录层/界面层问题 B/C/E4/F/H1/H2 的复现断言)
        run: node tests/regression-tests.js

      - name: Pi Agent 题库完整性与幂等适配
        run: |
          node tools/import-pi-agent.js --check
          node tests/pi-agent-test.js

      - name: 表达卡导出(工作台出口:内容真实/不产出空壳/转义正确)
        run: node tests/express-card-test.js

      - name: 学习记录冲突与项目证据卡
        run: |
          python -m pip install --quiet 'markdown-it-py==2.2.0'
          node tests/learning-records-test.js
          node tests/project-card-test.js

      - name: Shell 缓存戳一致性(改了 app/ 却没重新盖章 → 老用户拿旧缓存)
        run: node tests/shell-cache-stamp-test.js

      - name: LP-003 mock 分支测试(桩客户端,无真实 API)
        run: |
          python -m pip install --quiet 'openai>=2.0' 'pydantic>=2.5' || true
          python tests/lp003_mock_test.py

      - name: 路径练习自动化验证(阶段2/6 展示代码运行)
        run: python tests/path_exercise_test.py

      - name: 项目A 调用层验证(回喂/六场景)
        run: python tests/proj_a_test.py

      - name: 项目C 四层失败验证(拒答/检索漏/证据预算/错误 fake)
        run: python tests/proj_c_test.py

      - name: 项目C 四层诊断真实性(职责分离/固定配置/独立 oracle)
        run: python tests/proj_c_layers_test.py

      - name: 项目C 引用与主张核对(引用不能绕过内容校验)
        run: python tests/proj_c_claims_test.py

      - name: 审计器自检(占位符与越权断言的检查器本身必须是可信的)
        run: |
          python tools/content_audit.py --selftest
          python tools/verify_sources.py --selftest

      - name: 内容审计(十要素/交叉引用/学习路径引用)
        run: python tools/content_audit.py --strict

      - name: 来源结构检查(不联网,只验证链接可枚举)
        run: python tools/verify_sources.py --no-network

      - name: 校验题库(10 要素完整性 / 引号纪律 / ID 唯一)
        run: python tools/validate_bank.py

      - name: 重复度检测(n-gram 相似度)
        run: python tools/dedup_check.py

      - name: 引号修复幂等性(应为 no-op)
        run: |
          python tools/fix_quotes.py
          git diff --exit-code -- data/ || {
            echo '::error::fix_quotes.py 产生了改动,说明 data/ 存在未按规范转义的引号';
            exit 1;
          }

      - name: 构建可复现(data.js / sw.js 应无 diff)
        run: |
          python tools/build.py
          git diff --exit-code -- app/data.js app/sw.js || {
            echo '::error::build.py 产生了改动,仓库内的 app/data.js 或 sw.js 与源码/数据不同步。'
            echo '::error::请在本地跑 python tools/build.py 后一并提交;自查用 node tests/shell-cache-stamp-test.js';
            exit 1;
          }

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Playwright 与 Chromium
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      # 真浏览器回归:界面层行为 + 窄屏/键盘可达性。
      # 两个脚本自己会起隔离端口的本地静态服务(见 startServer),这里不用另起。
      - name: 界面层真浏览器回归(记录状态机/保存失败/深链落点)
        env:
          PW: playwright
          CHROME: default
          PORT: '8931'
        run: node tests/browser/ui-repro.js

      - name: 窄屏(360px)与键盘可达性回归
        env:
          PW: playwright
          CHROME: default
          PORT: '8933'
        run: node tests/browser/a11y-360.js

      # 全链验收:从空存储走完整用户旅程,含导出→清空→导入往返。
      # 其它套件都是「种好数据再验界面」,这一条证明没有预置数据时也能正常用、
      # 且数据真的落盘、真的能恢复。
      - name: 全链验收(空存储起,含工作台三件事/表达卡导出/导出清空导入往返)
        env:
          PW: playwright
          CHROME: default
          PORT: '8934'
        run: node tests/browser/e2e-acceptance.js

      - name: 项目口述/选定证据/真实下载/独立上下文恢复
        env:
          PW: playwright
          CHROME: default
          PORT: '8935'
        run: node tests/browser/project-evidence.js

      - name: Pi Agent 分类/长答案/检索/自测/旧记录保留
        env:
          PW: playwright
          CHROME: default
          PORT: '8936'
        run: node tests/browser/pi-agent.js
